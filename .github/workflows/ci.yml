name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Assert GitHub Pages project-site base
        run: |
          grep -q '/Terikiki/' dist/index.html
          test -f dist/samples/lecture-coupled-notes.pdf
          test -f dist/samples/note-beating.svg
          test -f dist/samples/note-envelope.svg
